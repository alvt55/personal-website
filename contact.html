<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in touch — [Your Name]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.contact-page{ overflow-y: auto; height: auto; min-height: 100%; }
  .contact-wrap{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8rem 8vw 4rem;
  }
  .contact-inner{ max-width: 620px; width: 100%; }
  .contact-inner .chapter{ margin-bottom: 0.8rem; }
  .contact-inner h1{
    font-family: var(--font-display);
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    margin: 0 0 1.2rem;
  }
  .contact-inner p.lead{
    color: var(--paper-dim);
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 48ch;
    margin-bottom: 3rem;
  }
  .contact-methods{
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 3rem;
  }
  .contact-method{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.1rem 1.4rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    text-decoration: none;
    color: var(--paper);
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .contact-method:hover{
    border-color: var(--sage);
    background: rgba(127,169,141,0.06);
  }
  .contact-method .label{ color: var(--paper-dim); font-size: 0.85rem; }
  .contact-method .value{ font-size: 1.02rem; }

  .contact-form{
    border-top: 1px solid var(--line);
    padding-top: 2.2rem;
  }
  .contact-form p.note{
    color: var(--ochre);
    font-size: 0.85rem;
    font-style: italic;
    margin-bottom: 1.4rem;
    opacity: 0.85;
  }
  .form-row{ margin-bottom: 1rem; }
  .form-row label{
    display: block;
    font-size: 0.85rem;
    color: var(--paper-dim);
    margin-bottom: 0.4rem;
  }
  .form-row input, .form-row textarea{
    width: 100%;
    background: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.8rem 1rem;
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 0.95rem;
  }
  .form-row textarea{ min-height: 120px; resize: vertical; }
  .form-submit{
    margin-top: 0.5rem;
    padding: 0.85rem 1.8rem;
    background: var(--sage);
    color: var(--ink);
    border: none;
    border-radius: 999px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .back-link{
    display: inline-block;
    margin-top: 3rem;
    font-size: 0.9rem;
    color: var(--paper-dim);
    text-decoration: none;
  }
  .back-link:hover{ color: var(--sage); }
</style>
</head>
<body class="contact-page">

<header class="site-chrome">
  <a class="mark" href="index.html">Alvin Tsui</a>
</header>

<div class="contact-wrap">
  <div class="contact-inner">
    <p class="chapter">Get in touch</p>
    <h1>Let's talk.</h1>
    <p class="lead">Feel free to reach out! Whether it's about a role, a project, or something you think I'd find interesting</p>

    <div class="contact-methods">
      <a class="contact-method" href="mailto:alvintsui95@gmail.com">
        <span class="value">alvintsui95@gmail.com</span>
        <span class="label">Email</span>
      </a>
      <a class="contact-method" href="https://linkedin.com/in/alvintsui" target="_blank" rel="noopener">
        <span class="value">alvintsui</span>
        <span class="label">LinkedIn</span>
      </a>
      <a class="contact-method" href="https://github.com/alvt55" target="_blank" rel="noopener">
        <span class="value">alvt55</span>
        <span class="label">GitHub</span>
      </a>
    </div>

    

</body>
</html>
